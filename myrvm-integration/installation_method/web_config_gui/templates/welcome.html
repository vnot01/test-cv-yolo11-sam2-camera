<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - RVM Installed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="alert alert-success d-flex align-items-center" role="alert">
        <i class="fas fa-check-circle fa-lg me-3"></i>
        <div>
            <strong>Installation Completed.</strong> Your RVM-Jetson is ready.
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title"><i class="fas fa-sitemap me-2"></i>API Connectivity Overview</h5>
            <p class="text-muted mb-3">Status ringkas konektivitas layanan utama.</p>
            <div id="api-status" class="row g-3">
                <div class="col-md-6">
                    <div class="border rounded p-3">
                        <h6><i class="fas fa-server me-2"></i>MyRVM-Platform</h6>
                        <div id="serverStatus">Checking...</div>
                        <div class="mt-2">
                            <a class="btn btn-sm btn-outline-primary" id="openServer" target="_blank">Open Server</a>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded p-3">
                        <h6><i class="fas fa-robot me-2"></i>RVM-Jetson Services</h6>
                        <ul class="mb-2" id="rvmServices">
                            <li>Remote Access: <span id="svc5000">Checking...</span></li>
                            <li>GUI Client: <span id="svc5001">Checking...</span></li>
                            <li>Camera Service: <span id="svc5002">Checking...</span></li>
                        </ul>
                        <div class="mt-2">
                            <a class="btn btn-sm btn-outline-secondary" href="/" >Back to Dashboard</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function checkJson(url, options) {
    try {
        const res = await fetch(url, options || {});
        return { ok: res.ok, data: await res.json() };
    } catch (e) { return { ok: false, error: e.message }; }
}

document.addEventListener('DOMContentLoaded', async () => {
    // Server
    const serverUrl = 'http://100.123.143.87:8001';
    const server = await checkJson('/api/server/test', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ server_url: serverUrl })});
    document.getElementById('serverStatus').textContent = server.ok && server.data.success ? 'Connected' : 'Unavailable';
    document.getElementById('openServer').href = serverUrl;

    // Local services (simple HTTP checks)
    for (const [id, port] of [['svc5000',5000],['svc5001',5001],['svc5002',5002]]) {
        try {
            const resp = await fetch(`http://localhost:${port}`, { method: 'GET', mode: 'no-cors' });
            document.getElementById(id).textContent = 'Listening';
        } catch (e) {
            document.getElementById(id).textContent = 'Unavailable';
        }
    }
});
</script>
</body>
</html>
